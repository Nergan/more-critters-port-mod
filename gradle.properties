# ============================================================
# Настройки Gradle
# ============================================================
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official
# Kotlin-файлов немного: отдельный демон Kotlin только съел бы память.
kotlin.compiler.execution.strategy=in-process

# ============================================================
# Parchment-маппинги
# ============================================================
parchment_minecraft_version=1.21.1
parchment_mappings_version=2024.11.17

# ============================================================
# Minecraft / NeoForge
# ============================================================
minecraft_version=1.21.1
minecraft_version_range=[1.21.1]
neo_version=21.1.209
loader_version_range=[1,)

# ============================================================
# Kotlin for Forge — https://modrinth.com/mod/kotlin-for-forge
# ============================================================
kotlin_version=2.1.20
kff_version=5.8.0
kff_version_range=[5.8,)

# ============================================================
# GeckoLib — https://modrinth.com/mod/geckolib (MIT)
# Версия внутри jar совпадает с номером на Modrinth: 4.9.3.
# ============================================================
geckolib_version=4.9.3
geckolib_version_range=[4.9.3,)

# ============================================================
# Метаданные мода
# ============================================================
mod_id=more_critters
mod_name=More Critters
mod_license=MPL-2.0
mod_version=1.4.5
mod_group_id=com.morecritters.mod
mod_authors=Nergan, Portakal Cevheri
mod_description=Adds new fantasy creatures in vanilla style. Unofficial NeoForge port of More Critters by Portakal_Cevheri.
